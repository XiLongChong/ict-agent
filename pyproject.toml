[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ict-agent"
version = "0.1.0"
description = "面向 ICT 分销经营与风控分析的可追溯数据 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.141,<1",
  "pydantic>=2.13,<3",
  "pydantic-ai-slim[openai]>=2.26,<3",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "ruff>=0.16,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ict_agent"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "docs/deep-research-report.md",
    "data/simulated/",  # 演示数据生成工具目录，不属于受管源码
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src"]
